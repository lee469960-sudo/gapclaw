name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_api: ${{ steps.meta.outputs.api }}
      image_web: ${{ steps.meta.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag and image names
        id: meta
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_IMAGE: ${{ secrets.ALIYUN_IMAGE }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Refusing tag '${TAG}'; expected vMAJOR.MINOR.PATCH (e.g. v1.0.0)" >&2
              exit 1
              ;;
          esac
          if [ -z "${ALIYUN_REGISTRY}" ] || [ -z "${ALIYUN_IMAGE}" ]; then
            echo "ALIYUN_REGISTRY and ALIYUN_IMAGE secrets are required" >&2
            exit 1
          fi
          API="${ALIYUN_REGISTRY}/${ALIYUN_IMAGE}"
          if [ "${ALIYUN_IMAGE}" != "${ALIYUN_IMAGE%-api}" ]; then
            WEB_PATH="${ALIYUN_IMAGE%-api}-web"
          else
            WEB_PATH="${ALIYUN_IMAGE}-web"
          fi
          WEB="${ALIYUN_REGISTRY}/${WEB_PATH}"
          {
            echo "tag=${TAG}"
            echo "api=${API}"
            echo "web=${WEB}"
          } >> "${GITHUB_OUTPUT}"
          echo "API image: ${API}:${TAG} (+ :latest)"
          echo "WEB image: ${WEB}:${TAG} (+ :latest)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push API (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.api }}:latest
          cache-from: type=gha,scope=gap-api
          cache-to: type=gha,mode=max,scope=gap-api

      - name: Build and push Web (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.web }}:latest
          cache-from: type=gha,scope=gap-web
          cache-to: type=gha,mode=max,scope=gap-web

  deploy:
    name: Deploy on self-hosted runner
    needs: build
    runs-on: [self-hosted, linux, production]
    timeout-minutes: 20
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@v4

      - name: Deploy from ACR
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          ALIYUN_IMAGE: ${{ secrets.ALIYUN_IMAGE }}
          IMAGE_API: ${{ needs.build.outputs.image_api }}
          IMAGE_WEB: ${{ needs.build.outputs.image_web }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: ./scripts/deploy.sh "${{ needs.build.outputs.image_tag }}"
