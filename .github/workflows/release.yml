name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_ID: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag and image names
        id: meta
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_IMAGE: ${{ secrets.ALIYUN_IMAGE }}
        run: |
          set -euo pipefail
          GIT_TAG="${GITHUB_REF_NAME}"
          if [[ ! "${GIT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing git tag '${GIT_TAG}'; expected vMAJOR.MINOR.PATCH (e.g. v1.0.0)" >&2
            exit 1
          fi
          if [ ! -f deploy/gap.version ]; then
            echo "deploy/gap.version is required" >&2
            exit 1
          fi
          TAG="$(tr -d '[:space:]' < deploy/gap.version)"
          if [ -z "${TAG}" ]; then
            echo "deploy/gap.version is empty" >&2
            exit 1
          fi
          if [ "${GIT_TAG}" != "${TAG}" ]; then
            echo "Refusing release: git tag '${GIT_TAG}' must exactly equal deploy/gap.version '${TAG}'" >&2
            exit 1
          fi
          # Keep the packaged file identical to git: CI tag only triggers the
          # build; image tag, /health, and UI footer all read this file.
          if [ -z "${ALIYUN_REGISTRY}" ] || [ -z "${ALIYUN_IMAGE}" ]; then
            echo "ALIYUN_REGISTRY and ALIYUN_IMAGE secrets are required" >&2
            exit 1
          fi
          API="${ALIYUN_REGISTRY}/${ALIYUN_IMAGE}"
          if [ "${ALIYUN_IMAGE}" != "${ALIYUN_IMAGE%-api}" ]; then
            WEB_PATH="${ALIYUN_IMAGE%-api}-web"
          else
            WEB_PATH="${ALIYUN_IMAGE}-web"
          fi
          WEB="${ALIYUN_REGISTRY}/${WEB_PATH}"
          {
            echo "tag=${TAG}"
            echo "api=${API}"
            echo "web=${WEB}"
          } >> "${GITHUB_OUTPUT}"
          echo "Using deploy/gap.version=${TAG} (git tag ${GIT_TAG} triggers the build)"
          echo "API image: ${API}:${TAG} (+ :latest)"
          echo "WEB image: ${WEB}:${TAG} (+ :latest)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push API (linux/amd64, linux/arm64)
        id: api-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.api }}:latest
          build-args: |
            GAP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=gap-api
          cache-to: type=gha,mode=max,scope=gap-api

      - name: Build and push Web (linux/amd64, linux/arm64)
        id: web-build
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.web }}:latest
          cache-from: type=gha,scope=gap-web
          cache-to: type=gha,mode=max,scope=gap-web

      - name: Create immutable release manifest
        env:
          GIT_TAG: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          VERSION: ${{ steps.meta.outputs.tag }}
          IMAGE_API: ${{ steps.meta.outputs.api }}
          IMAGE_WEB: ${{ steps.meta.outputs.web }}
          API_DIGEST: ${{ steps.api-build.outputs.digest }}
          WEB_DIGEST: ${{ steps.web-build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p .release
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          git_tag = os.environ["GIT_TAG"]
          version = os.environ["VERSION"]
          if git_tag != version:
              raise SystemExit("git tag and release version must match exactly")
          api_digest = os.environ["API_DIGEST"]
          web_digest = os.environ["WEB_DIGEST"]
          if not api_digest.startswith("sha256:") or not web_digest.startswith("sha256:"):
              raise SystemExit("build outputs must contain immutable image digests")

          manifest = {
              "schema_version": 1,
              "release_id": f"{git_tag}-{os.environ['GIT_SHA'][:8]}",
              "git_tag": git_tag,
              "version": version,
              "commit_sha": os.environ["GIT_SHA"],
              "target_id": os.environ["TARGET_ID"],
              "api_image": f"{os.environ['IMAGE_API']}@{api_digest}",
              "web_image": f"{os.environ['IMAGE_WEB']}@{web_digest}",
              "created_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "health_check_version": "v1",
          }
          with open(".release/release-manifest.json", "w", encoding="utf-8") as output:
              json.dump(manifest, output, sort_keys=True)
              output.write("\n")
          PY

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: gap-release-manifest
          path: .release/release-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Deliver signed manifest to GAP Hook
        env:
          RELEASE_HOOK_SECRET: ${{ secrets.GAP_RELEASE_HOOK_SECRET }}
          DELIVERY_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_HOOK_SECRET}"
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          from datetime import datetime, timezone

          with open(".release/release-manifest.json", encoding="utf-8") as source:
              manifest = json.load(source)

          envelope = {
              "delivery_id": os.environ["DELIVERY_ID"],
              "issued_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "manifest": manifest,
          }
          canonical = json.dumps(envelope, sort_keys=True, separators=(",", ":")).encode("utf-8")
          secret = os.environ["RELEASE_HOOK_SECRET"]
          print(f"release_hook_secret_len={len(secret)}")
          print(f"release_hook_secret_sha256_12={hashlib.sha256(secret.encode('utf-8')).hexdigest()[:12]}")
          signature = hmac.new(
              secret.encode("utf-8"), canonical, hashlib.sha256
          ).hexdigest()
          with open(".release/release-hook.json", "wb") as output:
              output.write(canonical)
          with open(".release/release-hook.signature", "w", encoding="utf-8") as output:
              output.write(f"sha256={signature}\\n")
          PY
          http_code="$(
            curl --silent --show-error --max-time 20 --retry 2 --retry-all-errors \
              --output .release/release-hook.response \
              --write-out "%{http_code}" \
              --request POST "https://gapclaw.online/internal/release-hook" \
              --header "Content-Type: application/json" \
              --header "X-GAP-Release-Signature: $(<.release/release-hook.signature)" \
              --data-binary @.release/release-hook.json
          )"
          cat .release/release-hook.response
          echo
          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "release hook returned HTTP ${http_code}" >&2
            exit 1
          fi
