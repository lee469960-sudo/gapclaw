name: Deploy GAP Staging

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Deploy verified manifest on fixed staging host runner
    runs-on: [self-hosted, linux, staging]
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Download verified staging release manifest
        uses: actions/download-artifact@v4
        with:
          name: gap-staging-release-manifest
          path: ${{ runner.temp }}/gap-staging-release-manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Deploy with fixed staging host runner
        shell: bash
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/gap-staging-release-manifest/release-manifest-staging.json"
          test -f "${manifest}"
          /opt/gap-staging-runner/bin/gap-deploy-runner deploy --manifest "${manifest}"
